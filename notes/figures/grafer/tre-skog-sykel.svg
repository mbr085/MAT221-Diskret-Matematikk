<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tre, skog og sykel</title>
  <desc id="desc">Et tre, en skog med to komponenter, og det samme treet med én ekstra kant som lager en sykel.</desc>
  <style>
    .edge { stroke: #111; stroke-width: 3; fill: none; stroke-linecap: round; }
    .vertex { stroke: #111; stroke-width: 3; fill: #dddddd; }
    .caption { fill: #111; font-family: Arial, Helvetica, sans-serif; font-size: 26px; text-anchor: middle; }
  </style>

  <!-- Panel 1: tree -->
  <g id="tree">
    <line class="edge" x1="180" y1="70" x2="110" y2="150"/>
    <line class="edge" x1="180" y1="70" x2="250" y2="150"/>
    <line class="edge" x1="110" y1="150" x2="70" y2="260"/>
    <line class="edge" x1="110" y1="150" x2="150" y2="260"/>
    <line class="edge" x1="250" y1="150" x2="250" y2="230"/>
    <line class="edge" x1="250" y1="230" x2="215" y2="310"/>
    <line class="edge" x1="250" y1="230" x2="285" y2="310"/>

    <circle class="vertex" cx="180" cy="70" r="17"/>
    <circle class="vertex" cx="110" cy="150" r="17"/>
    <circle class="vertex" cx="250" cy="150" r="17"/>
    <circle class="vertex" cx="70" cy="260" r="17"/>
    <circle class="vertex" cx="150" cy="260" r="17"/>
    <circle class="vertex" cx="250" cy="230" r="17"/>
    <circle class="vertex" cx="215" cy="310" r="17"/>
    <circle class="vertex" cx="285" cy="310" r="17"/>

    <text class="caption" x="180" y="395">Et tre</text>
  </g>

  <!-- Panel 2: forest -->
  <g id="forest" transform="translate(390,0)">
    <line class="edge" x1="105" y1="85" x2="105" y2="165"/>
    <line class="edge" x1="105" y1="165" x2="65" y2="260"/>
    <line class="edge" x1="105" y1="165" x2="145" y2="260"/>
    <line class="edge" x1="255" y1="115" x2="215" y2="230"/>
    <line class="edge" x1="255" y1="115" x2="295" y2="230"/>

    <circle class="vertex" cx="105" cy="85" r="17"/>
    <circle class="vertex" cx="105" cy="165" r="17"/>
    <circle class="vertex" cx="65" cy="260" r="17"/>
    <circle class="vertex" cx="145" cy="260" r="17"/>
    <circle class="vertex" cx="255" cy="115" r="17"/>
    <circle class="vertex" cx="215" cy="230" r="17"/>
    <circle class="vertex" cx="295" cy="230" r="17"/>

    <text class="caption" x="180" y="395">En skog</text>
  </g>

  <!-- Panel 3: same tree plus one extra edge -->
  <g id="cycle" transform="translate(780,0)">
    <line class="edge" x1="180" y1="70" x2="110" y2="150"/>
    <line class="edge" x1="180" y1="70" x2="250" y2="150"/>
    <line class="edge" x1="110" y1="150" x2="70" y2="260"/>
    <line class="edge" x1="110" y1="150" x2="150" y2="260"/>
    <line class="edge" x1="250" y1="150" x2="250" y2="230"/>
    <line class="edge" x1="250" y1="230" x2="215" y2="310"/>
    <line class="edge" x1="250" y1="230" x2="285" y2="310"/>
    <line class="edge" x1="110" y1="150" x2="250" y2="230"/>

    <circle class="vertex" cx="180" cy="70" r="17"/>
    <circle class="vertex" cx="110" cy="150" r="17"/>
    <circle class="vertex" cx="250" cy="150" r="17"/>
    <circle class="vertex" cx="70" cy="260" r="17"/>
    <circle class="vertex" cx="150" cy="260" r="17"/>
    <circle class="vertex" cx="250" cy="230" r="17"/>
    <circle class="vertex" cx="215" cy="310" r="17"/>
    <circle class="vertex" cx="285" cy="310" r="17"/>

    <text class="caption" x="180" y="395">En ekstra kant gir en sykel</text>
  </g>
</svg>
