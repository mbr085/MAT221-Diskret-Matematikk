<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Subdivisjon av en kant</title>
  <desc id="desc">En kant uv, den samme kanten subdividert med et nytt hjørne x, og en komplett graf med fem opprinnelige hjørner der én kant er subdividert.</desc>
  <style>
    .edge { stroke: #111; stroke-width: 3; fill: none; stroke-linecap: round; }
    .vertex { stroke: #111; stroke-width: 3; fill: #dddddd; }
    .caption { fill: #111; font-family: Arial, Helvetica, sans-serif; font-size: 24px; text-anchor: middle; }
    .label { fill: #111; font-family: "Times New Roman", Times, serif; font-size: 30px; font-style: italic; text-anchor: middle; }
  </style>

  <!-- Panel 1: u-v -->
  <g id="edge-uv">
    <line class="edge" x1="90" y1="210" x2="270" y2="210"/>
    <circle class="vertex" cx="90" cy="210" r="17"/>
    <circle class="vertex" cx="270" cy="210" r="17"/>
    <text class="label" x="90" y="165">u</text>
    <text class="label" x="270" y="165">v</text>
    <text class="caption" x="180" y="395">En kant</text>
  </g>

  <!-- Panel 2: u-x-v -->
  <g id="edge-uxv" transform="translate(360,0)">
    <line class="edge" x1="90" y1="210" x2="180" y2="210"/>
    <line class="edge" x1="180" y1="210" x2="270" y2="210"/>
    <circle class="vertex" cx="90" cy="210" r="17"/>
    <circle class="vertex" cx="180" cy="210" r="17"/>
    <circle class="vertex" cx="270" cy="210" r="17"/>
    <text class="label" x="90" y="165">u</text>
    <text class="label" x="180" y="165">x</text>
    <text class="label" x="270" y="165">v</text>
    <text class="caption" x="180" y="395">Kanten er subdividert</text>
  </g>

  <!-- Panel 3: K5 with one subdivided edge -->
  <g id="k5-subdivided" transform="translate(720,0)">
    <!-- The edge from the top vertex to the left middle vertex is replaced by two edges through x. -->
    <line class="edge" x1="180" y1="70" x2="135" y2="120"/>
    <line class="edge" x1="135" y1="120" x2="90" y2="170"/>
    <line class="edge" x1="180" y1="70" x2="270" y2="170"/>
    <line class="edge" x1="180" y1="70" x2="120" y2="310"/>
    <line class="edge" x1="180" y1="70" x2="240" y2="310"/>
    <line class="edge" x1="90" y1="170" x2="270" y2="170"/>
    <line class="edge" x1="90" y1="170" x2="120" y2="310"/>
    <line class="edge" x1="90" y1="170" x2="240" y2="310"/>
    <line class="edge" x1="270" y1="170" x2="120" y2="310"/>
    <line class="edge" x1="270" y1="170" x2="240" y2="310"/>
    <line class="edge" x1="120" y1="310" x2="240" y2="310"/>

    <circle class="vertex" cx="180" cy="70" r="17"/>
    <circle class="vertex" cx="135" cy="120" r="17"/>
    <circle class="vertex" cx="90" cy="170" r="17"/>
    <circle class="vertex" cx="270" cy="170" r="17"/>
    <circle class="vertex" cx="120" cy="310" r="17"/>
    <circle class="vertex" cx="240" cy="310" r="17"/>
    <text class="label" x="135" y="90">x</text>
    <text class="caption" x="180" y="395">En graf med én subdividert kant</text>
  </g>
</svg>
