<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">To bipartitte grafer</title>
  <desc id="desc">Til venstre en komplett bipartitt graf med tre hjørner i hver del. Til høyre en bipartitt graf med de samme delene, men uten alle mulige kanter.</desc>
  <style>
    .edge { stroke: #111; stroke-width: 3; fill: none; stroke-linecap: round; }
    .vertex { stroke: #111; stroke-width: 3; fill: #dddddd; }
    .caption { fill: #111; font-family: Arial, Helvetica, sans-serif; font-size: 26px; text-anchor: middle; }
    .part { fill: #111; font-family: "Times New Roman", Times, serif; font-size: 30px; font-style: italic; text-anchor: middle; }
  </style>

  <!-- Panel 1: komplett bipartitt 3+3 -->
  <g id="complete-bipartite">
    <text class="part" x="220" y="70">A</text>
    <text class="part" x="440" y="70">B</text>

    <line class="edge" x1="220" y1="120" x2="440" y2="120"/>
    <line class="edge" x1="220" y1="120" x2="440" y2="210"/>
    <line class="edge" x1="220" y1="120" x2="440" y2="300"/>
    <line class="edge" x1="220" y1="210" x2="440" y2="120"/>
    <line class="edge" x1="220" y1="210" x2="440" y2="210"/>
    <line class="edge" x1="220" y1="210" x2="440" y2="300"/>
    <line class="edge" x1="220" y1="300" x2="440" y2="120"/>
    <line class="edge" x1="220" y1="300" x2="440" y2="210"/>
    <line class="edge" x1="220" y1="300" x2="440" y2="300"/>

    <circle class="vertex" cx="220" cy="120" r="17"/>
    <circle class="vertex" cx="220" cy="210" r="17"/>
    <circle class="vertex" cx="220" cy="300" r="17"/>
    <circle class="vertex" cx="440" cy="120" r="17"/>
    <circle class="vertex" cx="440" cy="210" r="17"/>
    <circle class="vertex" cx="440" cy="300" r="17"/>

    <text class="caption" x="330" y="395">Bipartitt graf 3+3</text>
  </g>

  <!-- Panel 2: bipartitt, men ikke komplett -->
  <g id="noncomplete-bipartite">
    <text class="part" x="760" y="70">A</text>
    <text class="part" x="980" y="70">B</text>

    <line class="edge" x1="760" y1="120" x2="980" y2="120"/>
    <line class="edge" x1="760" y1="120" x2="980" y2="210"/>
    <line class="edge" x1="760" y1="210" x2="980" y2="210"/>
    <line class="edge" x1="760" y1="210" x2="980" y2="300"/>
    <line class="edge" x1="760" y1="300" x2="980" y2="120"/>
    <line class="edge" x1="760" y1="300" x2="980" y2="300"/>

    <circle class="vertex" cx="760" cy="120" r="17"/>
    <circle class="vertex" cx="760" cy="210" r="17"/>
    <circle class="vertex" cx="760" cy="300" r="17"/>
    <circle class="vertex" cx="980" cy="120" r="17"/>
    <circle class="vertex" cx="980" cy="210" r="17"/>
    <circle class="vertex" cx="980" cy="300" r="17"/>

    <text class="caption" x="870" y="395">Bipartitt, ikke komplett</text>
  </g>
</svg>
