<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">En vektet graf og et minimum spenntre</title>
  <desc id="desc">Den samme vektede grafen vises to ganger. Til høyre er kantene i et minimum spenntre fremhevet.</desc>
  <style>
    .edge { stroke: #f2f2f2; stroke-width: 3; fill: none; stroke-linecap: round; }
    .muted-edge { stroke: #666; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .tree-edge { stroke: #f2f2f2; stroke-width: 5; fill: none; stroke-linecap: round; }
    .vertex { stroke: #f2f2f2; stroke-width: 3; fill: #444444; }
    .vertex-label { fill: #f2f2f2; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .weight { fill: #f2f2f2; stroke: #222; stroke-width: 6; paint-order: stroke; stroke-linejoin: round; font-family: Arial, Helvetica, sans-serif; font-size: 20px; text-anchor: middle; }
    .caption { fill: #f2f2f2; font-family: Arial, Helvetica, sans-serif; font-size: 26px; text-anchor: middle; }
  </style>

  <defs>
    <g id="vertices">
      <circle class="vertex" cx="70" cy="220" r="17"/><text class="vertex-label" x="70" y="221">A</text>
      <circle class="vertex" cx="220" cy="75" r="17"/><text class="vertex-label" x="220" y="76">B</text>
      <circle class="vertex" cx="220" cy="235" r="17"/><text class="vertex-label" x="220" y="236">C</text>
      <circle class="vertex" cx="395" cy="105" r="17"/><text class="vertex-label" x="395" y="106">D</text>
      <circle class="vertex" cx="395" cy="305" r="17"/><text class="vertex-label" x="395" y="306">E</text>
      <circle class="vertex" cx="545" cy="215" r="17"/><text class="vertex-label" x="545" y="216">F</text>
    </g>
    <g id="weights">
      <text class="weight" x="135" y="133">4</text>
      <text class="weight" x="138" y="242">2</text>
      <text class="weight" x="238" y="158">1</text>
      <text class="weight" x="305" y="76">5</text>
      <text class="weight" x="318" y="185">8</text>
      <text class="weight" x="294" y="206">7</text>
      <text class="weight" x="312" y="284">10</text>
      <text class="weight" x="415" y="208">2</text>
      <text class="weight" x="486" y="146">6</text>
      <text class="weight" x="487" y="279">3</text>
    </g>
  </defs>

  <!-- Venstre panel: hele den vektede grafen -->
  <g id="weighted-graph" transform="translate(10,0)">
    <line class="edge" x1="70" y1="220" x2="220" y2="75"/>
    <line class="edge" x1="70" y1="220" x2="220" y2="235"/>
    <line class="edge" x1="220" y1="75" x2="220" y2="235"/>
    <line class="edge" x1="220" y1="75" x2="395" y2="105"/>
    <line class="edge" x1="220" y1="235" x2="395" y2="105"/>
    <line class="edge" x1="220" y1="75" x2="395" y2="305"/>
    <line class="edge" x1="220" y1="235" x2="395" y2="305"/>
    <line class="edge" x1="395" y1="105" x2="395" y2="305"/>
    <line class="edge" x1="395" y1="105" x2="545" y2="215"/>
    <line class="edge" x1="395" y1="305" x2="545" y2="215"/>
    <use href="#vertices"/>
    <use href="#weights"/>
    <text class="caption" x="305" y="415">Vektet graf</text>
  </g>

  <!-- Høyre panel: samme graf med et minimum spenntre fremhevet -->
  <g id="mst" transform="translate(610,0)">
    <line class="muted-edge" x1="70" y1="220" x2="220" y2="75"/>
    <line class="muted-edge" x1="70" y1="220" x2="220" y2="235"/>
    <line class="muted-edge" x1="220" y1="75" x2="220" y2="235"/>
    <line class="muted-edge" x1="220" y1="75" x2="395" y2="105"/>
    <line class="muted-edge" x1="220" y1="235" x2="395" y2="105"/>
    <line class="muted-edge" x1="220" y1="75" x2="395" y2="305"/>
    <line class="muted-edge" x1="220" y1="235" x2="395" y2="305"/>
    <line class="muted-edge" x1="395" y1="105" x2="395" y2="305"/>
    <line class="muted-edge" x1="395" y1="105" x2="545" y2="215"/>
    <line class="muted-edge" x1="395" y1="305" x2="545" y2="215"/>

    <line class="tree-edge" x1="70" y1="220" x2="220" y2="235"/>
    <line class="tree-edge" x1="220" y1="75" x2="220" y2="235"/>
    <line class="tree-edge" x1="220" y1="75" x2="395" y2="105"/>
    <line class="tree-edge" x1="395" y1="105" x2="395" y2="305"/>
    <line class="tree-edge" x1="395" y1="305" x2="545" y2="215"/>

    <use href="#vertices"/>
    <use href="#weights"/>
    <text class="caption" x="305" y="415">Et minimum spenntre</text>
  </g>
</svg>
