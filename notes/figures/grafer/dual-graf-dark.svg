<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">En plan graf og dens duale graf</title>
  <desc id="desc">Den plane grafen K4 er tegnet med A øverst, B nede til venstre, C nede til høyre og D i midten. Den duale grafen er lagt oppå med blå stiplete kanter og ett dualt hjørne i hver flate, også den ytre. Hver dualkant krysser nøyaktig én originalkant.</desc>
  <style>
    .edge { stroke: #f2f2f2; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .vertex { fill: #444; stroke: #f2f2f2; stroke-width: 3; }
    .vlabel { fill: #f2f2f2; font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
    .dual-edge { stroke: #78b7ff; stroke-width: 4; fill: none; stroke-dasharray: 10 8; stroke-linecap: round; stroke-linejoin: round; }
    .dual-vertex { fill: #78b7ff; stroke: #1f1f1f; stroke-width: 3; }
    .heading { fill: #f2f2f2; font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: bold; text-anchor: middle; }
    .note { fill: #f2f2f2; font-family: Arial, Helvetica, sans-serif; font-size: 21px; text-anchor: middle; }
    .legend { fill: #f2f2f2; font-family: Arial, Helvetica, sans-serif; font-size: 22px; }
  </style>

  <text class="heading" x="465" y="48">En plan graf og dens dual</text>

  <!-- Originalgraf G: samme K4-plassering som i sfære–plan-figuren. -->
  <g id="primal">
    <line class="edge" x1="440" y1="105" x2="215" y2="455"/>
    <line class="edge" x1="215" y1="455" x2="665" y2="455"/>
    <line class="edge" x1="665" y1="455" x2="440" y2="105"/>
    <line class="edge" x1="440" y1="300" x2="440" y2="105"/>
    <line class="edge" x1="440" y1="300" x2="215" y2="455"/>
    <line class="edge" x1="440" y1="300" x2="665" y2="455"/>
  </g>

  <!-- Dualgraf G*: ett hjørne i hver av de tre indre flatene og ett i den ytre. -->
  <g id="dual">
    <!-- Dualkanter over de tre indre originalkantene AD, BD, CD. -->
    <line class="dual-edge" x1="365" y1="282" x2="515" y2="282"/>
    <line class="dual-edge" x1="365" y1="282" x2="440" y2="402"/>
    <line class="dual-edge" x1="515" y1="282" x2="440" y2="402"/>

    <!-- Dualkant over ytterkanten BC. -->
    <line class="dual-edge" x1="440" y1="565" x2="440" y2="402"/>

    <!-- Dualkant over ytterkanten AB, ført gjennom den ytre flaten. -->
    <path class="dual-edge" d="M440 565
      C245 565 105 515 105 385
      C105 275 175 205 285 205
      C315 220 330 248 340 270
      C347 278 354 281 365 282"/>

    <!-- Dualkant over ytterkanten AC, ført gjennom den ytre flaten. -->
    <path class="dual-edge" d="M440 565
      C635 565 775 515 775 385
      C775 275 705 205 595 205
      C565 220 550 248 540 270
      C533 278 526 281 515 282"/>

    <circle class="dual-vertex" cx="365" cy="282" r="12"/>
    <circle class="dual-vertex" cx="515" cy="282" r="12"/>
    <circle class="dual-vertex" cx="440" cy="402" r="12"/>
    <circle class="dual-vertex" cx="440" cy="565" r="12"/>
  </g>

  <!-- Originalhjørnene legges øverst slik at de er tydelige der dualkanter krysser. -->
  <g id="primal-vertices">
    <circle class="vertex" cx="440" cy="105" r="18"/><text class="vlabel" x="440" y="105">A</text>
    <circle class="vertex" cx="215" cy="455" r="18"/><text class="vlabel" x="215" y="455">B</text>
    <circle class="vertex" cx="665" cy="455" r="18"/><text class="vlabel" x="665" y="455">C</text>
    <circle class="vertex" cx="440" cy="300" r="18"/><text class="vlabel" x="440" y="300">D</text>
  </g>

  <text class="note" x="440" y="612">det nederste blå hjørnet ligger i den ytre flaten</text>

  <!-- Forklaring/legend. -->
  <g id="legend">
    <text class="heading" x="965" y="155">Slik leses figuren</text>

    <line class="edge" x1="850" y1="220" x2="920" y2="220"/>
    <circle class="vertex" cx="885" cy="220" r="10"/>
    <text class="legend" x="945" y="227">originalgrafen G</text>

    <line class="dual-edge" x1="850" y1="285" x2="920" y2="285"/>
    <circle class="dual-vertex" cx="885" cy="285" r="9"/>
    <text class="legend" x="945" y="292">dualgrafen G*</text>

    <text class="legend" x="850" y="365">• ett dualt hjørne i hver flate</text>
    <text class="legend" x="850" y="408">• også ett i den ytre flaten</text>
    <text class="legend" x="850" y="451">• hver dualkant krysser én kant i G</text>
  </g>
</svg>
