<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
  <title id="title">De to dominodekningene av et 2 ganger 2-rektangel</title>
  <desc id="desc">Til venstre to loddrette dominobrikker, til høyre to vannrette dominobrikker.</desc>
  <rect width="640" height="280" fill="white"/>
  <g transform="translate(70 60)">
    <rect width="160" height="160" fill="#e4e4e4"/>
    <rect x="80" width="80" height="160" fill="#d1d1d1"/>
    <rect width="160" height="160" fill="none" stroke="#2f2f2f" stroke-width="5"/>
    <line x1="80" y1="0" x2="80" y2="160" stroke="#2f2f2f" stroke-width="5"/>
    <line x1="0" y1="80" x2="160" y2="80" stroke="#aaaaaa" stroke-width="2.5" stroke-dasharray="7 6"/>
  </g>
  <g transform="translate(410 60)">
    <rect width="160" height="80" fill="#e4e4e4"/>
    <rect y="80" width="160" height="80" fill="#d1d1d1"/>
    <rect width="160" height="160" fill="none" stroke="#2f2f2f" stroke-width="5"/>
    <line x1="0" y1="80" x2="160" y2="80" stroke="#2f2f2f" stroke-width="5"/>
    <line x1="80" y1="0" x2="80" y2="160" stroke="#aaaaaa" stroke-width="2.5" stroke-dasharray="7 6"/>
  </g>
</svg>
