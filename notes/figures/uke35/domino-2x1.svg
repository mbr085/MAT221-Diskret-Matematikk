<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="title desc">
  <title id="title">Den eneste dominodekningen av et 2 ganger 1-rektangel</title>
  <desc id="desc">Et rektangel med to ruter over hverandre dekkes av én loddrett dominobrikke.</desc>
  <rect width="320" height="260" fill="white"/>
  <rect x="110" y="35" width="100" height="190" fill="#e5e5e5" stroke="#2f2f2f" stroke-width="5"/>
  <line x1="110" y1="130" x2="210" y2="130" stroke="#a9a9a9" stroke-width="2.5" stroke-dasharray="7 6"/>
</svg>
