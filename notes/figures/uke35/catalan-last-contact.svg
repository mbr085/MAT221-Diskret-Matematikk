<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Oppdeling av en Catalan-sti ved siste møte med diagonalen</title>
  <desc id="desc">Et kvadratisk rutenett med en sti fra A til B som holder seg under diagonalen. C er siste møte med diagonalen før B. Segmentene før C og mellom D og E gir to mindre Catalan-problemer.</desc>
  <rect width="760" height="520" fill="white"/>
  <g transform="translate(70,40)">
    <g stroke="#d1d5db" stroke-width="1.6">
      <line x1="0" y1="0" x2="0" y2="360"/><line x1="60" y1="0" x2="60" y2="360"/><line x1="120" y1="0" x2="120" y2="360"/><line x1="180" y1="0" x2="180" y2="360"/><line x1="240" y1="0" x2="240" y2="360"/><line x1="300" y1="0" x2="300" y2="360"/><line x1="360" y1="0" x2="360" y2="360"/>
      <line x1="0" y1="0" x2="360" y2="0"/><line x1="0" y1="60" x2="360" y2="60"/><line x1="0" y1="120" x2="360" y2="120"/><line x1="0" y1="180" x2="360" y2="180"/><line x1="0" y1="240" x2="360" y2="240"/><line x1="0" y1="300" x2="360" y2="300"/><line x1="0" y1="360" x2="360" y2="360"/>
    </g>
    <rect x="0" y="0" width="360" height="360" fill="none" stroke="#374151" stroke-width="3"/>
    <line x1="0" y1="360" x2="360" y2="0" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8"/>
    <polyline points="0,360 60,360 60,300 120,300 180,300 180,240 180,180 240,180 300,180 300,120 360,120 360,60 360,0" fill="none" stroke="#111827" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#111827">
      <circle cx="0" cy="360" r="6"/><circle cx="180" cy="180" r="7"/><circle cx="240" cy="180" r="7"/><circle cx="360" cy="60" r="7"/><circle cx="360" cy="0" r="6"/>
    </g>
    <g fill="#111827" font-family="sans-serif" font-size="22">
      <text x="-30" y="390">A</text>
      <text x="370" y="5">B</text>
      <text x="125" y="165">C=(m,m)</text>
      <text x="235" y="210">D</text>
      <text x="372" y="68">E</text>
      <text x="65" y="330">pₘ</text>
      <text x="270" y="145">pₙ₋ₘ₋₁</text>
    </g>
  </g>
  <g fill="#374151" font-family="sans-serif" font-size="20">
    <text x="485" y="175">C er siste møte med</text>
    <text x="485" y="202">diagonalen før B.</text>
    <text x="485" y="255">Etter C må første</text>
    <text x="485" y="282">skritt gå mot høyre.</text>
  </g>
</svg>
