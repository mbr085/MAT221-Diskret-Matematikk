<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">3 ganger 3 rutenett med diagonal</title>
  <desc id="desc">Et 3 ganger 3 rutenett fra A nederst til venstre til B øverst til høyre, med diagonalen AB markert.</desc>
  <rect width="560" height="420" fill="white"/>
  <g stroke="#374151" stroke-width="3" fill="none">
    <rect x="110" y="55" width="300" height="300"/>
  </g>
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="210" y1="55" x2="210" y2="355"/>
    <line x1="310" y1="55" x2="310" y2="355"/>
    <line x1="110" y1="155" x2="410" y2="155"/>
    <line x1="110" y1="255" x2="410" y2="255"/>
  </g>
  <line x1="110" y1="355" x2="410" y2="55" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8"/>
  <g fill="#111827" font-family="sans-serif" font-size="24">
    <text x="76" y="382">A</text>
    <text x="425" y="55">B</text>
  </g>
</svg>
